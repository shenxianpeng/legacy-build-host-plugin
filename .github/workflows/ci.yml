# Build and test on GitHub until the plugin is hosted on ci.jenkins.io.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: legacy-build-host-hpi
          path: target/*.hpi
